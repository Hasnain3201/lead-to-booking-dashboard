[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lead-to-booking-dashboard"
version = "0.1.0"
description = "Lead-to-booking analytics for home-service businesses"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.45,<2",
    "duckdb>=1.3,<2",
    "pandas>=2.2,<3",
    "plotly>=6,<7",
    "starlette>=1,<2",
    "uvicorn>=0.30,<1",
    "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "httpx2>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

