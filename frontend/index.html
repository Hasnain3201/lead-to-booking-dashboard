<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Leadflow: lead-to-booking analytics for home-service businesses." />
    <title>Leadflow · From first hello to finished job</title>
    <script>
      try {
        const saved = localStorage.getItem('leadflow-theme-v2')
        if (saved === 'day' || saved === 'night') document.documentElement.dataset.theme = saved
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
